name: Repair production images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-production-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified WebP source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/2026
          python3 - <<'PY'
          import base64
          from pathlib import Path

          mapping = {
              'assets/authentic2/working.b64': 'assets/2026/hero-range-rover.webp',
              'assets/authentic2/paint.b64': 'assets/2026/foam-jeep.webp',
              'assets/authentic2/rv.b64': 'assets/2026/mobile-setup.webp',
          }
          for src, dst in mapping.items():
              text = ''.join(Path(src).read_text().split())
              text += '=' * (-len(text) % 4)
              data = base64.b64decode(text, validate=False)
              if not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
                  raise RuntimeError(f'Invalid WebP source: {src}')
              Path(dst).write_bytes(data)
              print(f'{dst}: {len(data)} bytes, verified WEBP')
          PY
      - name: Commit repaired production images
        shell: bash
        run: |
          if git diff --quiet -- assets/2026; then
            echo 'Production images already valid.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/2026/*.webp
          git commit -m 'Fix broken production photography'
          git push

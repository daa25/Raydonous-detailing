name: Deploy Raydonus to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raydonus-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare deployment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (or CF_API_TOKEN and CF_ACCOUNT_ID)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy full website and video assets to Cloudflare
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify worker website contains video posters
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          sleep 8
          page="$(curl -fsSL --retry 3 --max-time 20 https://raydonous-detailing.delbertalvarado4-342.workers.dev/)"
          if [ "$(printf '%s' "$page" | grep -o 'poster="assets/' | wc -l)" -lt 7 ]; then
            echo "::error::Cloudflare worker did not serve all seven video posters."
            exit 1
          fi
          echo "Cloudflare worker has seven video covers."
